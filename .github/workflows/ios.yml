name: Build iOS

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Parser and scorer self-test
        run: swiftc Shared/*.swift Tests/main.swift -o /tmp/selftest && /tmp/selftest

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project OfferReader.xcodeproj -target OfferReader -configuration Release -sdk iphoneos \
            BUILD_NUMBER=${{ github.run_number }} SYMROOT="$PWD/build" build | tail -40

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/OfferReader.app Payload/
          ls Payload/OfferReader.app/PlugIns
          zip -qry OfferReader.ipa Payload

      - name: Publish to "ios-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-latest
          name: Offer Reader for iPhone (latest build)
          body: "iOS build #${{ github.run_number }} from ${{ github.sha }}. Unsigned: install with Sideloadly using your Apple ID."
          files: ios/OfferReader.ipa
          make_latest: false
